name: Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401
      - name: Prepare pinned Rust toolchain
        timeout-minutes: 3
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile default --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
      - name: Build and test candidate
        timeout-minutes: 15
        shell: pwsh
        run: |
          $runId = 'ci-${{ github.run_id }}-${{ github.run_attempt }}'
          & ./tools/build-local-hud-package.ps1 -RunId $runId -DotnetExe (Get-Command dotnet).Source -AllowDependencyDownloads
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
      - name: Candidate ZIP and checksum (not a Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-candidate
          if-no-files-found: error
          path: |
            artifacts/candidates/ci-${{ github.run_id }}-${{ github.run_attempt }}/*.zip
            artifacts/candidates/ci-${{ github.run_id }}-${{ github.run_attempt }}/SHA256SUMS
